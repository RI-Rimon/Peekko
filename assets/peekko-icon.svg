<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172c54"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6efe2"/>
      <stop offset="100%" stop-color="#d9c6a5"/>
    </linearGradient>
  </defs>

  <!-- Navy Badge Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#eadbc2" stroke-width="4"/>

  <!-- Dark Interior Gap Behind Door -->
  <rect x="64" y="20" width="42" height="88" rx="6" fill="#050b18"/>

  <!-- Peeking Cartoon Hider Character Behind Door Edge -->
  <g transform="translate(68, 36)">
    <!-- Hooded Head -->
    <circle cx="18" cy="24" r="18" fill="#1e3a6d" stroke="#f6efe2" stroke-width="2.5"/>
    <!-- Body Shoulder -->
    <path d="M2,42 C2,32 34,32 34,42 L34,62 L2,62 Z" fill="#172c54" stroke="#f6efe2" stroke-width="2"/>
    <!-- Face Mask Opening -->
    <rect x="7" y="16" width="22" height="13" rx="6" fill="#091326"/>
    <!-- Expressive Cartoon Eyes Peeking Left/Outward -->
    <circle cx="14" cy="22.5" r="3.6" fill="#f6efe2"/>
    <circle cx="23.5" cy="22.5" r="3.6" fill="#f6efe2"/>
    <circle cx="13" cy="22.5" r="1.7" fill="#091326"/>
    <circle cx="22.5" cy="22.5" r="1.7" fill="#091326"/>
    <!-- Tiny Cartoon Fingers Holding Door Edge -->
    <ellipse cx="3" cy="36" rx="4.5" ry="3.2" fill="#f6efe2"/>
    <ellipse cx="3" cy="43" rx="4.5" ry="3.2" fill="#f6efe2"/>
  </g>

  <!-- Half-Open Door Leaf (Perspective Skew) -->
  <path d="M22,18 L72,24 L72,104 L22,110 Z" fill="url(#doorGrad)" stroke="#091326" stroke-width="3" stroke-linejoin="round"/>
  <!-- Door Panels -->
  <path d="M30,28 L62,32 L62,56 L30,54 Z" fill="none" stroke="#9e8762" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M30,66 L62,66 L62,92 L30,96 Z" fill="none" stroke="#9e8762" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Brass Doorknob -->
  <circle cx="62" cy="63" r="4.2" fill="#d97706" stroke="#091326" stroke-width="1.5"/>
</svg>
